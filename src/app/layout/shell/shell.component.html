<mat-sidenav-container class="h-screen">
  <mat-sidenav
    #drawer
    [mode]="'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
    class="w-64 border-r border-surface-200"
  >
    <app-nav (click)="sidenavOpened.set(false)" />
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="flex flex-col h-screen">
      <app-header (menuToggled)="toggleSidenav()" />

      <main class="flex-1 overflow-y-auto p-4 sm:p-6">
        <router-outlet />
      </main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
